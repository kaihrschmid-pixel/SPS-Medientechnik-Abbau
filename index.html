<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abbau-Board</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
/* VOICE: Werkzeug für die Crew – knapp, laut genug für die Halle
   IDEA: Load-out-Board hinter der Bühne, Teams als Linienfarben
   PICTURE: die POS-Kacheln selbst, Status als große Taster
   COLOUR+TYPE: pave Style Guide – dark-first, Trade-Show-Türkis als Akzent, Gradient nur als Kopflinie; Space Grotesk (Galette-Ersatz) + Segoe UI
   LAYOUT: Kopf mit Fortschritt, Tabs, ein Raster aus Kacheln */
:root{color-scheme:dark;--bg:#05050F;--card:#10121F;--ink:#FFFFFF;--mute:rgba(255,255,255,.6);--line:rgba(255,255,255,.14);
--acc:#00B7E9;--A:#F04541;--B:#00B7E9;--C:#FFBA3B;--ok:#74BA5B;--vio:#5654A2;--org:#F36940;
--grad:linear-gradient(90deg,#FFBA3B 0%,#F04541 25%,#5654A2 50%,#00B7E9 75%,#74BA5B 100%);
--hf:'Galette','Space Grotesk',sans-serif;--uf:'Segoe UI',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--uf);overflow-x:clip}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px max(4vw,12px) 0}
header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}
.logo{height:30px;width:auto;margin-right:12px;vertical-align:middle}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--hf);font-size:clamp(22px,5vw,32px);font-weight:700;display:flex;align-items:center;margin:0;line-height:1.05}
.me{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute)}
.me input{width:120px}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.bar b{font-family:var(--hf);font-size:20px;font-weight:700}.bar span{font-size:13px;color:var(--mute)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}.meter i{display:block;height:100%;background:var(--ok)}
nav{display:flex;gap:4px;overflow-x:auto}
nav{padding-bottom:3px}
nav a{flex:none;padding:10px 16px;font-family:var(--hf);font-weight:700;color:var(--mute);text-decoration:none}
nav a.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--acc)}
main{padding:14px max(4vw,12px) 60px;max-width:1240px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
button,.chip,input,select{font:inherit;font-size:16px}
.chip{min-height:44px;padding:0 14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:22px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--acc);color:#05050F}
.chip[data-team=A].on{background:var(--A);border-color:var(--A);color:#fff}.chip[data-team=B].on{background:var(--B);border-color:var(--B);color:#05050F}.chip[data-team=C].on{background:var(--C);border-color:var(--C);color:#111}
input[type=search],input[type=text],input[type=number]{min-height:44px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=search]{flex:1 1 180px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;border-left:8px solid var(--t,var(--line));display:flex;flex-direction:column;gap:8px}
.card.done{opacity:.55}
.card{overflow:hidden}
.map{position:relative;height:150px;margin:-12px -12px 2px -12px;border-bottom:1px solid var(--line)}
.map .mi{position:absolute;inset:0;background-image:var(--plan);background-repeat:no-repeat}
.map .mi,.plan img{filter:invert(.9) hue-rotate(180deg) contrast(.92)}
.map .ring{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border:4px solid var(--acc);border-radius:50%;box-shadow:0 0 0 3px rgba(0,183,233,.25),0 0 18px rgba(0,183,233,.5)}
.row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pos{font-family:var(--hf);font-size:24px;font-weight:700;line-height:1}
.bez{font-weight:600}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--line);white-space:nowrap}
.tag.p1{background:var(--org);color:#fff}.tag.led{background:var(--vio);color:#fff}.tag.raum{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.note{font-size:14px;color:var(--mute)}
.st{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.st button{min-height:44px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font-size:12px;font-weight:600;padding:2px;line-height:1.1;cursor:pointer}
.st button.on{background:var(--sc);border-color:var(--sc);color:#fff}
.meta{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meta button{border:0;background:none;color:var(--acc);font-weight:600;padding:0;min-height:0;cursor:pointer;font-size:12px}
h2{font-family:var(--hf);font-size:20px;font-weight:700;margin:22px 0 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2 small{font-size:14px;color:var(--mute);font-weight:600}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item.done .nm{text-decoration:line-through;color:var(--mute)}
.item input[type=checkbox]{width:28px;height:28px;accent-color:var(--ok)}
.nm{font-weight:600}.sub{font-size:13px;color:var(--mute)}
.qty{display:flex;align-items:center;gap:4px;white-space:nowrap}
.qty input{width:64px;text-align:right}
.qty .soll{font-size:13px;color:var(--mute)}
.qty .diff{font-size:13px;font-weight:800}
.ab .item{grid-template-columns:auto 90px minmax(0,1fr)}
.time{font-family:var(--hf);font-weight:700;white-space:nowrap}
.banner{background:var(--C);color:#05050F;padding:8px 12px;border-radius:8px;font-weight:600;margin-bottom:10px;display:none}
.empty{color:var(--mute);padding:24px 0}
.pmap{position:relative;height:calc(100dvh - var(--hh,200px));margin:-14px calc(-1*max(4vw,12px)) -60px;overflow:hidden}
#lmap{position:absolute;inset:0;background:#0b0b14}
.leaflet-container{font-family:var(--uf);background:#0b0b14}
.leaflet-image-layer.plimg{filter:invert(.92) hue-rotate(180deg) contrast(.95) brightness(.85)}
.leaflet-control-zoom a{background:var(--card)!important;color:#fff!important;border-color:var(--line)!important}
.leaflet-control-attribution{display:none}
@media (max-width:899px){.leaflet-control-zoom{display:none}}
.pm{--s:34px;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:var(--sc);box-shadow:0 0 0 3px var(--tc),0 2px 6px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font:700 11px/1 'Space Grotesk',sans-serif;color:#fff;cursor:pointer;transition:opacity .25s,transform .25s}
.pm.p1{--s:40px;font-size:12px}
#lmap[data-z="0"] .pm{--s:9px;font-size:0;box-shadow:0 0 0 2px var(--tc)}
#lmap[data-z="1"] .pm{--s:15px;font-size:0;box-shadow:0 0 0 2px var(--tc)}
#lmap[data-z="2"] .pm{--s:26px;font-size:9px}#lmap[data-z="2"] .pm.p1{--s:30px;font-size:10px}
#lmap[data-z="0"] .pm.sel,#lmap[data-z="1"] .pm.sel{--s:30px;font-size:10px}
.focus .pm:not(.sel){opacity:.3}
.pm.sel{transform:scale(1.25);z-index:1000}
.pm.sel::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--acc);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.pm.sel::after{animation:none}}
.pover{position:absolute;z-index:500;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.pover>*{pointer-events:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}.lg{display:flex;align-items:center;gap:4px}.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pover .legend{background:rgba(5,5,15,.85);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.pover .chip{min-height:34px;padding:0 12px;font-size:13px;background:rgba(5,5,15,.85)}
.panel{position:absolute;z-index:600;background:var(--card);border:1px solid var(--line);box-shadow:0 -6px 30px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.65,0,.35,1);overflow:auto;overscroll-behavior:contain}
.panel[hidden]{display:block;visibility:hidden}
@media (max-width:899px){.panel{left:0;right:0;bottom:0;max-height:58%;border-radius:18px 18px 0 0;padding:6px 14px 18px}.panel[hidden]{transform:translateY(105%)}
 .panel::before{content:'';display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}}
@media (min-width:900px){.panel{top:0;right:0;bottom:0;width:380px;border-radius:0;padding:16px}.panel[hidden]{transform:translateX(105%)}}
.panel .card{border:0;border-left:0;background:none;padding:0}
.panel .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--mute);font-size:26px;line-height:1;cursor:pointer;min-height:44px;min-width:44px}
.offl{display:grid;gap:4px;margin-top:8px}.offl button{display:flex;gap:10px;align-items:center;text-align:left;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.offl i{width:12px;height:12px;border-radius:50%;flex:none}.offl b{font-family:var(--hf);min-width:70px}.offl span{color:var(--mute);font-size:14px}
.back{border:0;background:none;color:var(--acc);font-weight:700;padding:0;min-height:36px;cursor:pointer}
.panel details{border-top:1px solid var(--line);padding-top:8px}.panel summary{cursor:pointer;font-weight:700;color:var(--mute);font-size:14px;min-height:32px}

.close{float:right;margin-bottom:8px}
@media(max-width:600px){.ab .item{grid-template-columns:auto minmax(0,1fr)}.ab .time{grid-column:2}.bars b{font-size:17px}}
@media(prefers-reduced-motion:no-preference){.meter i{transition:width .4s}}
.art{font-size:14px;line-height:1.35;margin:4px 0}.art b{display:inline-block;min-width:74px;font-weight:600;opacity:.7}
#lock{position:fixed;inset:0;z-index:50;background:#05050F;display:flex;align-items:center;justify-content:center;padding:20px}
#lock form{background:#10121F;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:22px;max-width:360px;width:100%;display:grid;gap:12px}
#lock h2{margin:0;font-size:22px;display:block}#lock p{margin:0}#lock input{font:inherit;font-size:18px;padding:12px;border:2px solid rgba(255,255,255,.2);border-radius:10px;background:#05050F;color:#fff}
#lock button{font-family:var(--hf);font-weight:700;font-size:18px;padding:12px;border:0;border-radius:999px;background:var(--acc);color:#05050F}
#lockErr{color:#F04541;font-weight:600;min-height:1.2em}
</style>
</head>
<body>
<header>
  <div class="top"><h1><img class="logo" src="https://cdn.prod.website-files.com/68b5780a63ef565d1e4d9670/68c9beb8209691d8c85af110_pave-logo.svg" alt="pave" onerror="this.remove()"><span id="ttl">Abbau-Board</span></h1>
    <label class="me">Ich bin <input id="me" type="text" placeholder="Name" autocomplete="off"></label></div>
  <div class="bars">
    <div class="bar"><b id="sPos">–</b> <span>POS abgebaut</span><div class="meter"><i id="mPos" style="width:0"></i></div></div>
    <div class="bar"><b id="sP1">–</b> <span>Prio 1 erledigt</span><div class="meter"><i id="mP1" style="width:0"></i></div></div>
    <div class="bar"><b id="sPack">–</b> <span>Packliste ✓</span><div class="meter"><i id="mPack" style="width:0"></i></div></div>
  </div>
  <nav><a href="#pos" data-v="pos">POS-Board</a><a href="#plan" data-v="plan">Grundriss</a><a href="#pack" data-v="pack">Packliste</a><a href="#ablauf" data-v="ablauf">Ablauf</a></nav>
</header>
<main>
  <div class="banner" id="banner"></div>
  <section id="v-pos">
    <div class="filters" id="fPos">
      <button class="chip on" data-team="">Alle</button><button class="chip" data-team="A">Team A</button><button class="chip" data-team="B">Team B</button><button class="chip" data-team="C">Team C</button>
      <button class="chip" id="onlyP1">Nur Prio 1</button><button class="chip" id="hideDone">Erledigte aus</button>
      <input type="search" id="qPos" placeholder="POS oder Name suchen">
    </div>
    <div class="grid" id="posGrid"></div>
  </section>
  <section id="v-plan" hidden>
    <div class="pmap" id="pmap"><div id="lmap"></div>
      <div class="pover"><span class="legend"><span class="lg"><i style="background:#4A4F63"></i>Offen</span><span class="lg"><i style="background:#F36940"></i>Zuspieler</span><span class="lg"><i style="background:#5654A2"></i>Displays ab</span><span class="lg"><i style="background:#00B7E9"></i>Gepackt</span><span class="lg"><i style="background:#74BA5B"></i>Abgebaut</span></span><span id="offChips"></span></div>
      <aside class="panel" id="panel" hidden aria-live="polite"><button class="x" id="panelX" aria-label="Schließen">×</button><div id="panelIn"></div></aside>
    </div>
  </section>
  <section id="v-pack" hidden>
    <div class="filters" id="fPack"></div>
    <div class="filters"><button class="chip" id="hidePacked">Gepacktes aus</button><input type="search" id="qPack" placeholder="Artikel, Lieferschein oder Auftrag suchen"></div>
    <div id="packList"></div>
  </section>
  <section id="v-ablauf" hidden class="ab"><div id="abList"></div></section>
</main>
<div id="lock"><form id="lockF"><h2>Abbau-Board</h2><p>Team-Passwort eingeben. Es wird auf diesem Gerät gemerkt.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Team-Passwort" required><button type="submit">Öffnen</button><p id="lockErr" role="alert"></p></form></div>
<script>
const SB_URL='https://rlpkexigbmvksxlojdev.supabase.co';
const SB_KEY='sb_publishable_nOuuQkKROxau2mwrCjiq3A_wdgbteFS';
const enc=new TextEncoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){const h=await crypto.subtle.digest('SHA-256',enc.encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function unlock(pw){
  const [dj,pj]=await Promise.all([fetch('data.enc',{cache:'no-cache'}).then(r=>r.json()),fetch('plan.enc',{cache:'no-cache'}).then(r=>r.json())]);
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(dj.salt),iterations:dj.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const dec=o=>crypto.subtle.decrypt({name:'AES-GCM',iv:b64(o.iv)},key,b64(o.ct));
  const data=JSON.parse(new TextDecoder().decode(await dec(dj)));
  const img=URL.createObjectURL(new Blob([await dec(pj)],{type:'image/jpeg'}));
  return {data,img,rpcKey:await sha('rpc:'+pw)};
}
async function rpc(fn,body){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const e=new Error('rpc '+r.status);e.status=r.status;throw e}
  return r.json();
}
(async()=>{
  const pwIn=document.getElementById('pw'),err=document.getElementById('lockErr');
  let pw=null;try{pw=localStorage.getItem('abbau-pw')}catch(e){}
  let U=null;
  if(pw){try{U=await unlock(pw)}catch(e){pw=null}}
  while(!U){
    await new Promise(res=>document.getElementById('lockF').onsubmit=e=>{e.preventDefault();res()});
    err.textContent='Prüfe …';
    try{U=await unlock(pwIn.value);pw=pwIn.value;try{localStorage.setItem('abbau-pw',pw)}catch(e){}err.textContent=''}
    catch(e){err.textContent='Passwort stimmt nicht.'}
  }
  document.getElementById('lock').remove();
  main(U);
})();
function main(U){
const D=U.data;
if(D.title){document.getElementById('ttl').textContent=D.title;document.title=D.title}
document.documentElement.style.setProperty('--plan',`url(${U.img})`);
const ST=[['offen','Offen','#4A4F63'],['zusp','Zuspieler gesichert','#F36940'],['disp','Displays ab','#5654A2'],['pack','Gepackt','#00B7E9'],['abgebaut','Abgebaut','#74BA5B']];
const stMap={'offen':'offen','Zuspieler gesichert':'zusp','Displays ab':'disp','gepackt':'pack','abgebaut':'abgebaut'};
const TC={A:'var(--A)',B:'var(--B)',C:'var(--C)'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={pos:{},pack:{},ablauf:{}};
let online=false,canWrite=true,since='1970-01-01T00:00:00Z';
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const me=document.getElementById('me');me.value=ls('abbau-me')||'';me.addEventListener('change',()=>ls('abbau-me',me.value.trim()));
const now=()=>new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const banner=t=>{const b=document.getElementById('banner');b.textContent=t||'';b.style.display=t?'block':'none'};

const posState=p=>Object.assign({status:stMap[p.status]||'offen',prio:p.prio},S.pos[p.id]||{});
const packState=it=>Object.assign({ist:null,done:false},S.pack[it.id]||{});

const F={team:'',p1:false,hide:false,q:'',tr:'',hidePacked:false,qp:''};
const sel=(id)=>document.getElementById(id);

function stats(){
  const ps=D.pos.map(p=>[p,posState(p)]);
  const done=ps.filter(([,s])=>s.status==='abgebaut').length;
  const p1=ps.filter(([,s])=>s.prio===1),p1d=p1.filter(([,s])=>s.status==='abgebaut').length;
  const pk=D.pack.filter(i=>packState(i).done).length;
  const set=(b,m,a,n)=>{sel(b).textContent=a+'/'+n;sel(m).style.width=(n?100*a/n:0)+'%'};
  set('sPos','mPos',done,D.pos.length);set('sP1','mP1',p1d,p1.length);set('sPack','mPack',pk,D.pack.length);
}

function renderPos(){
  const q=F.q.toLowerCase();
  const list=D.pos.map(p=>[p,posState(p)]).filter(([p,s])=>(!F.team||p.team===F.team)&&(!F.p1||s.prio===1)&&(!F.hide||s.status!=='abgebaut')&&(!q||(p.pos+' '+p.bez+' '+p.ber+' '+(p.dl||'')+' '+(p.zl||'')).toLowerCase().includes(q)))
   .sort((a,b)=>a[1].prio-b[1].prio||(a[1].status==='abgebaut')-(b[1].status==='abgebaut')||a[0].team.localeCompare(b[0].team)||a[0].pos.localeCompare(b[0].pos,'de',{numeric:true}));
  sel('posGrid').innerHTML=list.length?list.map(([p,s])=>card(p,s)).join(''):'<p class="empty">Keine POS für diesen Filter.</p>';
}
const PS=1,IW=3228,IH=1867,SC=IW/4150;
function bg(p){const L=LOC[p.pos];if(!L)return '';const W=IW*PS,H=IH*PS,X=(L[0]-550)*SC*PS,Y=(L[1]-150)*SC*PS;
  return `<div class="map" data-goto="${esc(p.id)}" title="Im Grundriss zeigen" style="cursor:pointer"><div class="mi" style="background-size:${W.toFixed(0)}px ${H.toFixed(0)}px;background-position:calc(50% + ${(W/2-X).toFixed(0)}px) calc(50% + ${(H/2-Y).toFixed(0)}px)"></div><div class="ring"></div></div>`}
function card(p,s,nob){return `<article class="card${s.status==='abgebaut'?' done':''}" style="--t:${TC[p.team]}">${nob?'':bg(p)}
   <div class="row"><span class="pos">${esc(p.pos)}</span><span class="bez">${esc(p.bez)}</span></div>
   <div class="row"><span class="tag" style="background:${TC[p.team]};color:${p.team==='A'?'#fff':'#05050F'}">Team ${esc(p.team)}</span>${s.prio===1?'<span class="tag p1">Prio 1</span>':'<span class="tag">Prio 2</span>'}${p.raum?'<span class="tag raum">Raum</span>':''}${p.led?'<span class="tag led">vor LED-Wand</span>':''}<span class="tag">${p.disp} Displays · ${p.zusp} Zuspieler</span></div>
   ${p.dl?`<div class="art"><b>Displays</b> ${esc(p.dl)}</div>`:''}${p.zl?`<div class="art"><b>Zuspieler</b> ${esc(p.zl)}</div>`:''}
   ${p.note?`<div class="note">${esc(p.note)}</div>`:''}
   <div class="st">${ST.map(([k,l,c])=>`<button data-pos="${esc(p.id)}" data-st="${k}" class="${s.status===k?'on':''}" style="--sc:${c}" aria-pressed="${s.status===k}">${l}</button>`).join('')}</div>
   <div class="meta"><span>${s.by?esc(s.by)+' · '+esc(s.at||''):'noch nicht angefasst'}</span><button data-prio="${esc(p.id)}">${s.prio===1?'auf Prio 2 setzen':'auf Prio 1 setzen'}</button></div>
  </article>`}
const LOC=D.loc;
const stCol=k=>(ST.find(x=>x[0]===k)||ST[0])[2];
let openPos=null,LM=null,MK={};
const HEX={A:'#F04541',B:'#00B7E9',C:'#FFBA3B'};
const ll=p=>{const L=LOC[p.pos];return [IH-(L[1]-150)*SC,(L[0]-550)*SC]};
const icon=(p,s)=>L.divIcon({className:'',iconSize:[0,0],html:`<div class="pm${s.prio===1?' p1':''}${openPos===p.id?' sel':''}" style="--sc:${stCol(s.status)};--tc:${HEX[p.team]}">${esc(p.pos.length>4?p.pos.slice(0,4):p.pos)}</div>`});
function initMap(){
  if(LM||!window.L)return;
  LM=L.map('lmap',{crs:L.CRS.Simple,minZoom:-3,maxZoom:2,zoomSnap:.25,zoomDelta:.5,attributionControl:false,zoomControl:true});
  const B=[[0,0],[IH,IW]];L.imageOverlay(U.img,B,{className:'plimg'}).addTo(LM);LM.fitBounds(B);LM.setMaxBounds(L.latLngBounds(B).pad(.3));
  LM.zoomControl.setPosition('bottomleft');
  const zc=()=>{const z=LM.getZoom();sel('lmap').dataset.z=z<-2?0:z<-1?1:z<0?2:3};LM.on('zoomend',zc);
  if(!isDesk())LM.setView(L.latLngBounds(B).getCenter(),-1.5);zc();
  for(const p of D.pos.filter(p=>LOC[p.pos])){const m=L.marker(ll(p),{icon:icon(p,posState(p)),keyboard:true,title:p.pos+' '+p.bez});m.on('click',()=>openP(p.id,true));m.addTo(LM);MK[p.id]=m}
  LM.on('click',()=>closeP());
}
const isDesk=()=>matchMedia('(min-width:900px)').matches;
function flyTo(p){
  if(!LM||!LOC[p.pos])return;
  const z=Math.max(LM.getZoom(),0.5),pt=LM.project(ll(p),z);
  const pan=sel('panel');const off=isDesk()?L.point(pan.offsetWidth/2,0):L.point(0,Math.min(pan.offsetHeight||sel('pmap').offsetHeight*.5,sel('pmap').offsetHeight*.58)/2);
  LM.flyTo(LM.unproject(pt.add(off),z),z,{duration:.5,easeLinearity:.2});
}
function openP(id,fly){openPos=id;sel('panel').hidden=false;sel('pmap').classList.add('focus');renderPlan();
  const p=D.pos.find(x=>x.id===id);if(fly&&p)requestAnimationFrame(()=>flyTo(p))}
function closeP(){openPos=null;sel('panel').hidden=true;sel('pmap').classList.remove('focus');renderPlan()}
function panelHTML(p,s){
  const c=card(p,s,true);
  return c;
}
function renderPlan(){
  if(LM)for(const p of D.pos){const m=MK[p.id];if(m)m.setIcon(icon(p,posState(p)))}
  const off=D.pos.filter(p=>!LOC[p.pos]);
  const od=off.filter(p=>posState(p).status==='abgebaut').length;
  sel('offChips').innerHTML=off.length?`<button class="chip" data-off="__off">Ohne Planplatz · ${od}/${off.length}</button>`:'';
  if(openPos==='__off')sel('panelIn').innerHTML=`<h2 style="margin-top:4px">Ohne Planplatz</h2><p class="note">Vertical Area, NCC West und weitere Positionen, die nicht im Grundriss stehen.</p><div class="offl">${off.map(p=>{const s=posState(p);return `<button data-off="${esc(p.id)}"><i style="background:${stCol(s.status)}"></i><b>${esc(p.pos)}</b><span>${esc(p.bez)}</span></button>`}).join('')}</div>`;
  else if(openPos){const p=D.pos.find(x=>x.id===openPos);if(p)sel('panelIn').innerHTML=(LOC[p.pos]?'':'<button class="back" data-off="__off">‹ Ohne Planplatz</button>')+panelHTML(p,posState(p))}
}

const trs=[...new Set(D.pack.map(i=>i.t))];
sel('fPack').innerHTML='<button class="chip on" data-tr="">Alle Transporte</button>'+trs.map(t=>`<button class="chip" data-tr="${esc(t)}">${esc(t.split(' · ')[0])}</button>`).join('');
function renderPack(){
  const q=F.qp.toLowerCase();
  const html=trs.filter(t=>!F.tr||t===F.tr).map(t=>{
    const all=D.pack.filter(i=>i.t===t),dn=all.filter(i=>packState(i).done).length;
    const rows=all.filter(i=>(!F.hidePacked||!packState(i).done)&&(!q||(i.n+' '+i.a+' '+i.note).toLowerCase().includes(q)));
    if(!rows.length)return '';
    return `<h2>${esc(t)} <small>${dn}/${all.length} gepackt</small></h2>`+rows.map(i=>{const s=packState(i);const d=s.ist==null||i.soll==null?'':s.ist-i.soll;
      return `<div class="item${s.done?' done':''}"><input type="checkbox" data-pk="${i.id}" ${s.done?'checked':''} aria-label="gepackt">
      <div><div class="nm">${esc(i.n)}</div><div class="sub">${esc(i.a)}${i.note?' · '+esc(i.note):''}${s.by?' · ✓ '+esc(s.by)+' '+esc(s.at||''):''}</div></div>
      <div class="qty"><input type="number" inputmode="numeric" min="0" data-ist="${i.id}" value="${s.ist??''}" placeholder="Ist" aria-label="Ist-Menge"><span class="soll">/ ${i.soll??'–'}</span>${d===''?'':`<span class="diff" style="color:${d<0?'var(--A)':d>0?'var(--B)':'var(--ok)'}">${d>0?'+':''}${d}</span>`}</div></div>`}).join('');
  }).join('');
  sel('packList').innerHTML=html||'<p class="empty">Nichts gefunden.</p>';
}

function renderAb(){
  let day='';
  sel('abList').innerHTML=D.ablauf.map(a=>{const s=S.ablauf[a.id]||{};const h=a.day!==day?`<h2>${esc(a.day)}</h2>`:'';day=a.day;
    return h+`<div class="item${s.done?' done':''}"><input type="checkbox" data-ab="${a.id}" ${s.done?'checked':''} aria-label="erledigt"><span class="time">${esc(a.t)}</span>
    <div><div class="nm">${esc(a.task)}</div><div class="sub">${esc(a.who)}${a.note?' · '+esc(a.note):''}${s.by?' · ✓ '+esc(s.by)+' '+esc(s.at||''):''}</div></div></div>`}).join('');
}
const render=()=>{stats();renderPos();renderPlan();renderPack();renderAb()};

async function save(col,id,data){
  const who=me.value.trim()||'?';const body=Object.assign({},S[col][id]||{},data,{by:who,at:now()});
  S[col][id]=body;render();
  if(!canWrite)return;
  try{await rpc('set_state',{p_key:U.rpcKey,p_col:col,p_id:id,p_data:body});pull()}catch(e){if(e.status===401||e.status===403){canWrite=false;banner('Zugang zur Datenbank verweigert – Seite neu laden.')}else banner('Speichern hat gerade nicht geklappt – bitte nochmal tippen.')}
}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');if(g){location.hash='#plan';setTimeout(()=>openP(g.dataset.goto,true),60);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='panelX'){closeP();return}
  if(b.dataset.off){openP(b.dataset.off,false);return}
  if(b.dataset.st){const p=D.pos.find(x=>x.id===b.dataset.pos);if(!me.value.trim()){me.focus();banner('Bitte oben kurz deinen Namen eintragen.');return}banner('');save('pos',p.id,{status:b.dataset.st,prio:posState(p).prio})}
  else if(b.dataset.prio){const p=D.pos.find(x=>x.id===b.dataset.prio);const s=posState(p);save('pos',p.id,{status:s.status,prio:s.prio===1?2:1})}
  else if('team' in b.dataset){F.team=b.dataset.team;document.querySelectorAll('#fPos [data-team]').forEach(c=>c.classList.toggle('on',c===b));renderPos()}
  else if(b.id==='onlyP1'){F.p1=!F.p1;b.classList.toggle('on',F.p1);renderPos()}
  else if(b.id==='hideDone'){F.hide=!F.hide;b.classList.toggle('on',F.hide);renderPos()}
  else if('tr' in b.dataset){F.tr=b.dataset.tr;document.querySelectorAll('#fPack [data-tr]').forEach(c=>c.classList.toggle('on',c===b));renderPack()}
  else if(b.id==='hidePacked'){F.hidePacked=!F.hidePacked;b.classList.toggle('on',F.hidePacked);renderPack()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pk){const s=packState({id:t.dataset.pk});save('pack',t.dataset.pk,{ist:s.ist,done:t.checked})}
  else if(t.dataset.ist){const v=t.value===''?null:Math.max(0,parseInt(t.value,10)||0);const s=packState({id:t.dataset.ist});save('pack',t.dataset.ist,{ist:v,done:s.done})}
  else if(t.dataset.ab){save('ablauf',t.dataset.ab,{done:t.checked})}
});
sel('qPos').addEventListener('input',e=>{F.q=e.target.value;renderPos()});
sel('qPack').addEventListener('input',e=>{F.qp=e.target.value;renderPack()});

function route(){const v=['pos','plan','pack','ablauf'].includes(location.hash.slice(1))?location.hash.slice(1):'pos';
  for(const k of ['pos','plan','pack','ablauf'])sel('v-'+k).hidden=k!==v;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');
  if(v==='plan'){initMap();if(LM)setTimeout(()=>LM.invalidateSize(),0)}}
addEventListener('resize',()=>{document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');if(LM)LM.invalidateSize()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&openPos)closeP()});
addEventListener('hashchange',route);route();render();

let busy=false;
async function pull(){
  if(busy)return;busy=true;
  try{const rows=await rpc('get_state',{p_key:U.rpcKey,p_since:since});
    if(rows.length){let mx=0;for(const r of rows){if(S[r.col])S[r.col][r.id]=r.data;mx=Math.max(mx,Date.parse(r.updated_at)||0)}
      if(mx)since=new Date(Math.max(Date.parse(since),mx-5000)).toISOString();render()}
    if(!online){online=true;banner('')}
  }catch(e){online=false;banner(e.status===401||e.status===403?'Zugang zur Datenbank verweigert.':'Keine Verbindung zur Datenbank – Änderungen werden evtl. nicht geteilt.')}
  finally{busy=false}
}
pull();setInterval(()=>{if(!document.hidden)pull()},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
}
</script>
</body>
</html>
